<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sair</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fef2f2, #fff7ed);
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .card {
      width: min(520px, 90vw);
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
      padding: 32px;
      text-align: center;
    }

    .icone {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #fee2e2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #dc2626;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: #111827;
    }

    p {
      margin: 0 0 24px;
      color: #4b5563;
      line-height: 1.6;
      font-size: 1rem;
    }

    .acoes {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: 0.2s ease;
    }

    .btn-cancelar {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-cancelar:hover {
      background: #d1d5db;
    }

    .btn-sair {
      background: #dc2626;
      color: #fff;
    }

    .btn-sair:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icone">⎋</div>
    <h1>Sair</h1>
    <p>Tem certeza que deseja sair da sua conta? Você poderá entrar novamente quando quiser.</p>

    <div class="acoes">
      <a href="dropdown.html" class="btn btn-cancelar">Cancelar</a>
      <a href="dropdown.html" class="btn btn-sair" id="confirmar-sair">Sair</a>
    </div>
  </main>

  <script>
    const btnSair = document.getElementById('confirmar-sair');

    btnSair.addEventListener('click', (event) => {
      event.preventDefault();
      localStorage.removeItem('perfil_usuario');
      localStorage.removeItem('configuracoes_usuario');
      window.location.href = 'dropdown.html';
    });
  </script>
</body>
</html>
